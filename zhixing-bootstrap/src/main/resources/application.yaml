spring:
  application:
    name: zhixing
  datasource:
    # R1-BE 配置外置：PG_URL/PG_USER/PG_PASSWORD 可环境变量覆盖（compose/部署用），
    # 默认值保持本地零配置可跑
    url: ${PG_URL:jdbc:postgresql://127.0.0.1:5432/zhixing}
    username: ${PG_USER:postgres}
    password: ${PG_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      pool-name: ZhixingHikariPool
  servlet:
    multipart:
      max-file-size: 50MB       # 入库线上传上限（详设-阶段1 §7）
      max-request-size: 50MB

server:
  port: 9090

# 冒烟/实跑需在环境变量提供 DEEPSEEK_API_KEY、ZHIPU_API_KEY（IDEA 运行配置透传）。
# 占位符带 ": " 默认空串：本地无 key 也能启动，只有真正调用时才会 401。
zhixing:
  auth:
    session-ttl-days: 7                     # 会话有效期：7 天滑动续期（02 §B1）
    renew-window-hours: 24                  # 滑动续期节流：剩余寿命不足 24h 才续，活跃会话至多每天一次 UPDATE
    max-failed-attempts: 5                  # 连续失败锁定阈值（02 §B1：5 次锁 5 分钟，单实例内存计数）
    lock-minutes: 5
  llm:
    providers:
      deepseek:
        base-url: https://api.deepseek.com
        api-key: ${DEEPSEEK_API_KEY:}
        chat-model: deepseek-chat
      zhipu:
        base-url: https://open.bigmodel.cn/api/paas/v4
        api-key: ${ZHIPU_API_KEY:}
        chat-model: glm-4-flash             # 备选/辅助调用（免费档）；模型名以智谱控制台为准
        embedding-model: embedding-3        # dimensions 入参可选 256~2048
      siliconflow:                          # OpenAI 兼容 /v1/embeddings（embedding 备胎示例供应商，T5-2/DL-19）
        base-url: https://api.siliconflow.cn/v1
        api-key: ${SILICONFLOW_API_KEY:}
        embedding-model: BAAI/bge-m3
    chat:
      primary: deepseek/deepseek-chat       # 主力（2026-10-19 网络恢复切回；注意 deepseek 侧模型更名，请求 chat 返回 flash，控制台核实后更新模型名）
      fallback: zhipu/glm-4-flash           # 一主一备、跨供应商降级（阶段 4 容错，阶段 1 只用 primary）
      timeout-ms: 60000
      first-token-timeout-ms: 15000         # 首包超时（v0.2 ResilientChatDecorator 消费）
      circuit:
        failure-threshold: 3                # 连续可降级失败 → 熔断（DL-15 ④）
        open-seconds: 30
        half-open-attempts: 1
    embedding:
      provider: zhipu
      fallback: ""                          # 备胎 provider/model 二段（如 siliconflow/BAAI/bge-m3）；空 = 无备胎单通道
      dimensions: 1024                      # 必须与 DDL vector(1024) 一致，入库后不可改；主备模型都必须产出同维向量
      batch-size: 16                        # 保守值；客户端超限自动分片
    rerank:
      provider: noop                        # 智谱暂无公开 rerank 端点：NoopClient 截断直通
      enabled: false                        # 接口保留；日后接硅基流动/Jina 只需加 provider 与配置
  storage:
    type: local                             # local（默认单机）| minio（v2.0 F4，FileStorage 双实现 D17）
    local-root: data/files                  # 本地磁盘存储根目录，落盘 {root}/{docId}/{文件名}
    minio:                                  # type=minio 时生效；endpoint/ak/sk 部署时以环境变量覆盖
      endpoint: ${MINIO_ENDPOINT:}
      access-key: ${MINIO_ACCESS_KEY:}
      secret-key: ${MINIO_SECRET_KEY:}
      bucket: zhixing
  demo:
    seed-enabled: true                      # 首启向导可选「加载演示库」（F8）；classpath 内置演示文档（resources/demo/），docs/ 不入库
    kb-name: 演示库                          # 种子库显示名
    docs-pattern: classpath:demo/*          # 种子文档 classpath 模式
  ingest:
    pool-core: 2                            # 入库异步线程池（有界队列 64 + CallerRuns 背压）
    pool-max: 4

  # ===== 以下为检索问答线（T1-5/T1-6/T1-7）配置 =====
  retrieve:
    vector-top-k: 20                        # 向量通道召回数
    keyword-top-k: 20                       # 关键词通道召回数
    rrf-k: 60                               # RRF 融合常数
    final-top-k: 5                          # 融合排序后最终返回条数
    keyword-mode: trgm                      # trgm | ilike（ILIKE 保底开关，详设 §4.1 注）
    pool-core: 4                            # 检索双通道并行池
    pool-max: 8
  qa:
    pool-core: 2                            # QA 链路池（与检索池隔离，避免嵌套提交饿死）
    pool-max: 4
    emitter-timeout-ms: 900000              # SSE 超时 15 分钟
  eval:
    enabled: false                          # 评测旁路开关（按需开启；T1-7 baseline 已收口，评测时置 true）
    key: local-eval-key                     # X-Eval-Key 比对值（生产环境务必改掉）
    set-path: docs/scenario/eval-set.jsonl  # 评估集路径（EvalRunner 读）
    kb-id: 2110626172473077760              # 评估目标知识库（场景包评估库，ingest-ready 清洗版 10 篇）
    pool-core: 1                            # 验收向导执行池（F6，与检索池隔离——评测不饿死在线问答）
    pool-max: 2
    max-inline-set-chars: 200000            # 内联评估集字符护栏
  trace:
    enabled: true                           # Trace 埋点总开关（压测/生产可关）
    max-text-length: 2000                   # node input/output 落库截断

  # ===== 以下为阶段 2（多轮对话）契约基线配置（详设 08-阶段2 §12） =====
  memory:
    window-size: 8                          # 记忆窗口（完整轮数，作者校准值）
    long-term:
      enabled: true                         # 长期记忆：回合级异步仲裁 + 双链路注入（DL-17）
      max-inject: 20                        # 注入条数上限（超限取最近更新）
  summary:
    trigger-turns: 9                        # 完成轮数达到即同步滚动摘要
    max-chars: 200                          # 摘要上限
  rewrite:
    enabled: true                           # 问题重写总开关（关闭 = 阶段 1 单轮行为）
    keyword-channel: true                   # 重写关键词数组进检索（D6 对比开关）

  # ===== 阶段 3（ReAct Agent）契约基线配置（详设 13-阶段3 §12） =====
  agent:
    max-iterations: 10                      # 最大迭代轮数，耗尽强制无工具作答（DL-15 ②）
    max-context-chars: 100000               # messages 水位，超限裁剪→LLM 摘要压缩（DL-15 ①）
    tool-timeout-ms: 30000                  # 单工具执行超时
    mcp:
      enabled: false                        # 交付默认关闭（详设-v1.0 §6：无 server 配置时零行为）；演示启用见 README
      command: node                         # stdio 启动命令
      args: mcp-server-demo/server.mjs      # 演示 server 启动参数
