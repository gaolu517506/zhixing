name: Feature request（功能建议）
description: 提议一个新功能或改进
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        提议前请先检索已有 issue 与 README 的 Roadmap，避免重复。

  - type: textarea
    id: problem
    attributes:
      label: 解决什么问题
      description: 描述你遇到的具体场景与痛点，而不是直接给方案
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望方案
      description: 你希望它如何工作
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 你考虑过的其他做法，或现有 workaround
